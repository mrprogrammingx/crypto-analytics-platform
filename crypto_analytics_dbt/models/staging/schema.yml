version: 2

models:
  - name: stg_btc_prices
    description: "Staging table for raw BTC trades from GCS/BigQuery source"
    columns:
      - name: event_time
        tests:
          - not_null

      - name: symbol
        tests:
          - not_null

      - name: price
        tests:
          - not_null

      - name: quantity
        tests:
          - not_null
