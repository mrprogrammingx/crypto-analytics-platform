name: CI - Python tests & dbt

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
 
permissions:
  contents: write
  pages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    env:
      BIGQUERY_TABLE_ID: crypto_analytics.btc_trades
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install runtime deps (if present)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi

      - name: Install dbt core and duckdb adapter (pinned)
        run: |
          pip install dbt-core==1.10.1 dbt-duckdb==1.10.1

      - name: Create DuckDB warehouse file (for docs/tests)
        run: |
          mkdir -p crypto_analytics_dbt/warehouse
          # create a valid DuckDB file by creating a dummy table (duckdb is available after dbt-duckdb install)
          python -c "import duckdb; duckdb.connect('crypto_analytics_dbt/warehouse/analytics.duckdb').execute('CREATE TABLE IF NOT EXISTS __init(dummy INTEGER);')"

      - name: Run dbt tests using DuckDB (fast, no GCP required)
        run: |
          if [ -f crypto_analytics_dbt/dbt_project.yml ]; then cd crypto_analytics_dbt; fi
          dbt --version
          dbt test --profiles-dir . --target duck || echo 'duck dbt tests failed (non-fatal)'

      - name: Run unit tests (pytest)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pip install pytest
          pytest -q --ignore=tests/test_read_btc_parquet.py --ignore=tests/test_verify_schema_inference.py

      - name: Prepare Google credentials + install bigquery adapter + run BigQuery dbt tests (optional)
        run: |
          if [ -n "${GCP_SA_KEY}" ]; then
            echo "Detected GCP_SA_KEY in secrets; preparing BigQuery tests..."
            echo "$GCP_SA_KEY" | base64 --decode > /tmp/gcp-key.json
            echo "Wrote GCP key to /tmp/gcp-key.json"
            python -m pip install dbt-bigquery==1.10.1
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json
            if [ -f crypto_analytics_dbt/dbt_project.yml ]; then cd crypto_analytics_dbt; fi
            dbt --version
            dbt test --profiles-dir . || (echo 'dbt test failed' && exit 1)
          else
            echo "GCP_SA_KEY not present; skipping BigQuery adapter install and tests"
          fi

      - name: Generate dbt docs
        run: |
          if [ -f crypto_analytics_dbt/dbt_project.yml ]; then cd crypto_analytics_dbt; fi
          dbt docs generate --profiles-dir .

      - name: Upload dbt docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: |
            crypto_analytics_dbt/target
            target

  deploy-docs:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download generated docs
        uses: actions/download-artifact@v4
        with:
          name: dbt-docs
          path: artifacts

      - name: Normalize docs folder for publish
        run: |
          if [ -d artifacts/crypto_analytics_dbt/target ]; then
            rm -rf public || true
            cp -r artifacts/crypto_analytics_dbt/target public
          elif [ -d artifacts/target ]; then
            rm -rf public || true
            cp -r artifacts/target public
          else
            echo "No docs artifact found" && exit 1
          fi

      - name: Deploy docs to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public

  spark-tests:
    runs-on: ubuntu-latest
    # Run Spark tests in a separate job with Java installed
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (required for PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dev dependencies (pyspark) and pyarrow
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt || true; fi
          pip install pyarrow pytest || true

      - name: Run Spark-specific tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q tests/test_read_btc_parquet.py -q

  spark-verify-sample:
    runs-on: ubuntu-latest
    needs: spark-tests
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (required for PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Prepare sample parquet files and run verifier
        run: |
          python -m pip install --upgrade pip
          pip install pyarrow pyspark || true
          printf "%s\n" "import pyarrow as pa, pyarrow.parquet as pq, tempfile, os" \
            "tmp = tempfile.mkdtemp()" \
            "p1 = os.path.join(tmp, 'part1.parquet')" \
            "p2 = os.path.join(tmp, 'part2.parquet')" \
            "pq.write_table(pa.table({'a': pa.array([1,2], type=pa.int32())}), p1)" \
            "pq.write_table(pa.table({'a': pa.array(['x','y'], type=pa.string())}), p2)" \
            "print('files created in', tmp)" \
            "import subprocess" \
            "subprocess.check_call(['python','spark/jobs/verify_schema_inference.py','--paths',p1,p2])" \
            > /tmp/run_verify.py
          python /tmp/run_verify.py
