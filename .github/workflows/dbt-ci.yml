name: CI - Python tests & dbt

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install runtime deps (if present)
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi

      - name: Install dbt core and bigquery adapter
        run: |
          pip install dbt-core==1.11.0 dbt-bigquery==1.11.0

      - name: Prepare Google credentials (optional)
        if: ${{ secrets.GCP_SA_KEY != '' }}
        run: |
          echo "$GCP_SA_KEY" > /tmp/gcp-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Run unit tests (pytest)
        run: |
          pip install pytest
          pytest -q

      - name: Run dbt tests
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          BIGQUERY_DATASET: ${{ secrets.BIGQUERY_DATASET }}
        run: |
          cd crypto_analytics_dbt
          # dbt profiles.yml in this repo uses env_var(); we rely on CI env vars/secrets
          dbt --version
          dbt test --profiles-dir . || (echo 'dbt test failed' && exit 1)

      - name: Generate dbt docs
        run: |
          cd crypto_analytics_dbt
          dbt docs generate --profiles-dir .

      - name: Upload dbt docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: crypto_analytics_dbt/target

  deploy-docs:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download generated docs
        uses: actions/download-artifact@v4
        with:
          name: dbt-docs
          path: crypto_analytics_dbt/target

      - name: Deploy docs to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: crypto_analytics_dbt/target
