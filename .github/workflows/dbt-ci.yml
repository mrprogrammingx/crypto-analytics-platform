name: CI - Python tests & dbt

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install runtime deps (if present)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi

      - name: Install dbt core and duckdb adapter (pinned)
        run: |
          pip install dbt-core==1.10.1 dbt-duckdb==1.10.1

      - name: Run dbt tests using DuckDB (fast, no GCP required)
        run: |
          if [ -f crypto_analytics_dbt/dbt_project.yml ]; then cd crypto_analytics_dbt; fi
          dbt --version
          dbt test --profiles-dir . --target duck || echo 'duck dbt tests failed (non-fatal)'

      - name: Run unit tests (pytest)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pip install pytest
          pytest -q

      - name: Prepare Google credentials + install bigquery adapter + run BigQuery dbt tests (optional)
        run: |
          if [ -n "${GCP_SA_KEY}" ]; then
            echo "Detected GCP_SA_KEY in secrets; preparing BigQuery tests..."
            echo "$GCP_SA_KEY" | base64 --decode > /tmp/gcp-key.json
            echo "Wrote GCP key to /tmp/gcp-key.json"
            python -m pip install dbt-bigquery==1.10.1
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json
            if [ -f crypto_analytics_dbt/dbt_project.yml ]; then cd crypto_analytics_dbt; fi
            dbt --version
            dbt test --profiles-dir . || (echo 'dbt test failed' && exit 1)
          else
            echo "GCP_SA_KEY not present; skipping BigQuery adapter install and tests"
          fi

      - name: Generate dbt docs
        run: |
          if [ -f crypto_analytics_dbt/dbt_project.yml ]; then cd crypto_analytics_dbt; fi
          dbt docs generate --profiles-dir .

      - name: Upload dbt docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: |
            crypto_analytics_dbt/target
            target

  deploy-docs:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download generated docs
        uses: actions/download-artifact@v4
        with:
          name: dbt-docs
          path: artifacts

      - name: Normalize docs folder for publish
        run: |
          if [ -d artifacts/crypto_analytics_dbt/target ]; then
            rm -rf public || true
            cp -r artifacts/crypto_analytics_dbt/target public
          elif [ -d artifacts/target ]; then
            rm -rf public || true
            cp -r artifacts/target public
          else
            echo "No docs artifact found" && exit 1
          fi

      - name: Deploy docs to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
